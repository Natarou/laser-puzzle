<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>Laser Puzzle</title>
  </head>
  <body>
    <h1>Laser Puzzle</h1>
    <p>STAGE <span id="stage-num">0</span></p>

    <canvas
      id="game"
      width="300"
      height="300"
      style="border: 2px solid #aaaaaa;"
    ></canvas>

    <br>
    <button id="restart-button">RESTART</button>
    <button id="next-stage-button">NEXT STAGE</button>

    <!-- Canvas が作られてから JS を読み込む -->
    <script>
      var Module = {
        // main() が終了しても実行環境を維持する
        noExitRuntime: true
      };
    </script>
    <script src="input.js"></script>
    <script src="build/main.js"></script>
  </body>
</html>
